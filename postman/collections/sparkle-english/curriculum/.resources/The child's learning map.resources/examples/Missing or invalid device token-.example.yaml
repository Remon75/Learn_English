$kind: http-example
name: Missing or invalid device token.
request:
  url: "{{baseUrl}}/api/v1/map"
  method: GET
  headers:
    - key: X-Device-Token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "message": "string"
      }
order: 2000
