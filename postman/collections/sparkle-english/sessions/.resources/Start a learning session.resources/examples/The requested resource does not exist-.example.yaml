$kind: http-example
name: The requested resource does not exist.
request:
  url: "{{baseUrl}}/api/v1/sessions"
  method: POST
  headers:
    - key: X-Device-Token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "lessonId": "l1-u1-s1"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "message": "string"
      }
order: 3000
