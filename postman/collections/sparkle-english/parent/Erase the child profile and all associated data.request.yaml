$kind: http-request
description: |
  The GDPR-K erasure path. Removes the profile and every row that
  references it. Nothing is left in any analytics system because no
  such system exists.
url: "{{baseUrl}}/api/v1/parent/profile"
method: DELETE
headers:
  Accept: application/json
  X-Caregiver-Pin: "{{caregiverPin}}"
auth:
  type: apikey
  credentials:
    key: X-Device-Token
    value: "{{deviceToken}}"
    in: header
settings: {}
examples: ./.resources/Erase the child profile and all associated data.resources/examples
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('erases the profile', () => pm.response.to.have.status(200));
      pm.test('confirms deletion', () => pm.expect(pm.response.json().deleted).to.eql(true));
