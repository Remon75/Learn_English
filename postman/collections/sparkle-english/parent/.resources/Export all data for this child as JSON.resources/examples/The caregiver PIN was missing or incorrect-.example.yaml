$kind: http-example
name: The caregiver PIN was missing or incorrect.
request:
  url: "{{baseUrl}}/api/v1/parent/export"
  method: GET
  headers:
    - key: X-Device-Token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "message": "string"
      }
order: 2000
