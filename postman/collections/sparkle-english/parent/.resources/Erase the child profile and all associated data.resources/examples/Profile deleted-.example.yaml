$kind: http-example
name: Profile deleted.
request:
  url: "{{baseUrl}}/api/v1/parent/profile"
  method: DELETE
  headers:
    - key: X-Device-Token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "deleted": false,
        "childId": "string"
      }
order: 1000
