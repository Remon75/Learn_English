$kind: http-example
name: The settings.
request:
  url: "{{baseUrl}}/api/v1/parent/settings"
  method: GET
  headers:
    - key: X-Device-Token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "settings": {
          "childId": "string",
          "dailyLimitMinutes": 120,
          "sharingRequiresApproval": false,
          "microphoneEnabled": false,
          "offlineDownloadsEnabled": true,
          "audioEnabled": false,
          "caregiverLocale": "string",
          "allowOutboundNetwork": false,
          "bedtimeLock": "string",
          "bedtimeWake": "string"
        }
      }
order: 1000
