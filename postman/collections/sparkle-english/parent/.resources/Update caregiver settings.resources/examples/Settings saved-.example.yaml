$kind: http-example
name: Settings saved.
request:
  url: "{{baseUrl}}/api/v1/parent/settings"
  method: PUT
  headers:
    - key: X-Device-Token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "dailyLimitMinutes": 122,
        "bedtimeLock": "20:02",
        "bedtimeWake": "04:03",
        "sharingRequiresApproval": false,
        "microphoneEnabled": true,
        "offlineDownloadsEnabled": false,
        "audioEnabled": true,
        "caregiverLocale": "string",
        "allowOutboundNetwork": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "settings": {
          "childId": "string",
          "dailyLimitMinutes": 120,
          "sharingRequiresApproval": false,
          "microphoneEnabled": false,
          "offlineDownloadsEnabled": true,
          "audioEnabled": false,
          "caregiverLocale": "string",
          "allowOutboundNetwork": false,
          "bedtimeLock": "string",
          "bedtimeWake": "string"
        }
      }
order: 1000
